version: 2
# PR titles become squash-merge subjects, which the cpf commit rules limit
# to 72 characters including " (#N)". Dependabot titles cannot be
# templated: keep the prefix unscoped and group names short, because a
# group with one update is titled
# "<prefix>: bump <dep> from <a> to <b> in the <group> group".
updates:
  # npm (uncomment when the project has a package.json; Dependabot fails
  # every run for an ecosystem whose manifest is missing)
  # - package-ecosystem: 'npm'
  #   directory: '/'
  #   schedule:
  #     interval: 'weekly'
  #   commit-message:
  #     prefix: 'build'
  #   groups:
  #     js:
  #       update-types:
  #         - 'minor'
  #         - 'patch'

  # Python (uncomment to enable)
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "build"
  #   groups:
  #     py:
  #       update-types:
  #         - "minor"
  #         - "patch"

  # Rust (uncomment to enable)
  # - package-ecosystem: "cargo"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "build"
  #   groups:
  #     rs:
  #       update-types:
  #         - "minor"
  #         - "patch"

  # Go (uncomment to enable)
  # - package-ecosystem: "gomod"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "build"
  #   groups:
  #     go:
  #       update-types:
  #         - "minor"
  #         - "patch"

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
    groups:
      gha:
        update-types:
          - 'minor'
          - 'patch'
