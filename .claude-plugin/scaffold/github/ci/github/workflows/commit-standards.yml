name: Commit Standards

on:
  pull_request:
    branches: [main]
    # `edited` re-runs the check when the PR title changes; the title
    # becomes the squash-merge subject.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate commits and PR title (cpf checks runtime)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bash .cpf/runtime/commit-check.sh --range "$BASE..$HEAD"
          bash .cpf/runtime/commit-check.sh --title "$TITLE" --pr "$PR_NUMBER"
