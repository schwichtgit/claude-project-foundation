name: Release

# Tag-triggered release. Runs the cpf checks runtime (the same checks as
# CI and the local hooks), then creates a GitHub release with generated
# notes. Projects that author their own Claude Code plugin (a manifest at
# .claude-plugin/plugin.json) also get a tag/manifest version check and
# an attested plugin tarball; for every other project those steps are
# skipped.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # Node linters come from the node root's lockfile ("node": {"root"}
      # in .cpf/policy.json, default the project root).
      - name: Install node linters
        run: |
          root="$(jq -r '.node.root // "."' .cpf/policy.json 2>/dev/null || echo .)"
          if [ -f "$root/package-lock.json" ]; then
            npm ci --prefix "$root"
          else
            echo "No $root/package-lock.json: installing unpinned node linters"
            npm install --no-save --no-package-lock --prefix "$root" prettier@3 markdownlint-cli2 # cpf: unpinned fallback
          fi
      - name: cpf checks (ci boundary)
        run: bash .cpf/runtime/verify.sh --boundary ci
      - name: Pin compliance
        run: bash .cpf/runtime/pins.sh check

  release:
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Plugin manifest version check and tarball
        id: plugin
        run: |
          if [ ! -f .claude-plugin/plugin.json ]; then
            echo "No plugin manifest: version check and tarball skipped."
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "Tag version:    $TAG_VERSION"
          echo "Plugin version: $PLUGIN_VERSION"
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "FAIL: Tag version ($TAG_VERSION) does not match plugin.json version ($PLUGIN_VERSION)"
            exit 1
          fi
          NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          tar -czf "${NAME}-${TAG_VERSION}.tar.gz" \
            --exclude='.git' --exclude='node_modules' .claude-plugin/
          echo "artifact=${NAME}-${TAG_VERSION}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        if: steps.plugin.outputs.artifact != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.plugin.outputs.artifact }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.plugin.outputs.artifact }}
        run: |
          gh release create "$GITHUB_REF_NAME" ${ARTIFACT:+"$ARTIFACT"} \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
