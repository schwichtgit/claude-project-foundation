name: Bug Report
description: Report a defect
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project is affected?
      options:
        - Application code
        - Tests
        - Quality gates (.cpf/, git hooks, CI)
        - CI workflows (.github/workflows/)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, relevant tool versions.
      placeholder: |
        - OS: macOS 15.3 / Ubuntu 24.04
        - Relevant tool versions: ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any error messages or log output.
      render: shell
    validations:
      required: false
