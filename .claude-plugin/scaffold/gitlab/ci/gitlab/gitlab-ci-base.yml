# ---------------------------------------------------------------------------
# GitLab CI -- equivalent quality gates to the GitHub Actions CI workflow
# ---------------------------------------------------------------------------
# Stages: lint -> test -> release
# The `summary` job in the test stage is the single merge-gate check.
# Require only `summary` in your protected-branch pipeline-success rules.
# ---------------------------------------------------------------------------

stages:
  - lint
  - test
  - release

variables:
  NODE_VERSION: '22'

default:
  image: node:${NODE_VERSION}-slim

# ===========================================================================
# Lint stage: the cpf checks runtime (.cpf/runtime/), the same code the
# Claude Code hooks and git hooks run. Scope comes from .cpf/policy.json;
# tool versions from package-lock.json and .tool-versions. Project-specific
# jobs belong in the host .gitlab-ci.yml, not in this file.
# ===========================================================================

checks:
  stage: lint
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends bash git jq curl xz-utils ca-certificates shellcheck >/dev/null
    - |
      if [ -f package-lock.json ]; then
        npm ci --ignore-scripts
      else
        echo "No package-lock.json: installing unpinned node linters"
        npm install --no-save --no-package-lock prettier@3 markdownlint-cli2
      fi
  script:
    - bash .cpf/runtime/verify.sh --boundary ci
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

commit-standards:
  stage: lint
  image: alpine:latest
  script:
    - apk add --no-cache bash git python3 >/dev/null
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - bash .cpf/runtime/commit-check.sh --range "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}..HEAD"
    # GitLab uses the MR title as the squash commit message.
    - bash .cpf/runtime/commit-check.sh --title "$CI_MERGE_REQUEST_TITLE"
  rules:
    - if: $CI_MERGE_REQUEST_IID

# ---------------------------------------------------------------------------
# Plugin validation is NOT part of the scaffold base. Downstream projects
# consume the cpf plugin from the Claude Code plugin cache and have no
# plugin source of their own. Projects that author their own Claude Code
# plugin can add a plugin-validation job to the host .gitlab-ci.yml (see
# the commented example there).
# ---------------------------------------------------------------------------

# ===========================================================================
# Test stage
# ===========================================================================

# ---------------------------------------------------------------------------
# Summary -- single merge-gate check
# ---------------------------------------------------------------------------
# Require ONLY this job in protected-branch pipeline-success rules.
# ---------------------------------------------------------------------------
summary:
  stage: test
  needs:
    - job: checks
      optional: true
    - job: commit-standards
      optional: true
  script:
    - echo "All upstream lint jobs passed (or were not created)."
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ===========================================================================
# Release stage
# ===========================================================================

# ---------------------------------------------------------------------------
# Validate tag version against plugin.json and create release
# ---------------------------------------------------------------------------
release:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache jq
  script:
    - TAG_VERSION="${CI_COMMIT_TAG#v}"
    - |
      # Only projects that author a Claude Code plugin have a plugin
      # manifest to compare against; others skip the version check.
      if [ ! -f .claude-plugin/plugin.json ]; then
        echo "No plugin manifest: tag version check skipped."
        exit 0
      fi
      PLUGIN_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
      echo "Tag version:    $TAG_VERSION"
      echo "Plugin version: $PLUGIN_VERSION"

      if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
        echo "FAIL: Tag ($TAG_VERSION) != plugin.json ($PLUGIN_VERSION)"
        exit 1
      fi

      echo "PASS: versions match"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
