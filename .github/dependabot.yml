version: 2
# PR titles become squash-merge subjects, which commit-check.sh limits to
# 72 characters including " (#N)". Dependabot titles cannot be templated:
# keep the prefix unscoped and group names short, because a group with one
# update is titled "<prefix>: bump <dep> from <a> to <b> in the <group> group".
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
    groups:
      gha:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
    groups:
      js:
        update-types:
          - 'minor'
          - 'patch'
